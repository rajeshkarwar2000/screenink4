name: Build APK
on: [workflow_dispatch, push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: 8.7}
      - name: Prepare project
        run: |
          ls -la
          Z=$(ls *.zip 2>/dev/null | head -n1)
          if [ -n "$Z" ]; then unzip -q "$Z"; fi
          F=$(find . -name settings.gradle.kts -not -path './.git/*' | head -n1)
          if [ -z "$F" ]; then echo "No project found. Upload the ScreenInk zip to the repo."; exit 1; fi
          echo "PROJ=$(dirname "$F")" >> $GITHUB_ENV
      - name: Build
        run: cd "$PROJ" && gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: ScreenInk-apk
          path: "**/app-debug.apk"
          if-no-files-found: error
